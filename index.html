<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navigation Tab Menu Vol. 1 | @coding.stella</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Floating Spotlight Tab Menu with Laser Scanner -->
  <nav class="spotlight-nav" id="spotlightNav" role="navigation" aria-label="Main Navigation">
    <ul class="nav-list">

      <!-- Tab 1: Home -->
      <li class="nav-item">
        <button class="nav-btn active" data-tab="home" aria-label="Home">
          <div class="spotlight-lamp" aria-hidden="true">
            <span class="indicator-bar"></span>
            <span class="spotlight-beam"></span>
            <span class="scan-line"></span>
          </div>
          <svg class="nav-icon icon-home" viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </button>
      </li>

      <!-- Tab 2: Favorites -->
      <li class="nav-item">
        <button class="nav-btn" data-tab="heart" aria-label="Favorites">
          <div class="spotlight-lamp" aria-hidden="true">
            <span class="indicator-bar"></span>
            <span class="spotlight-beam"></span>
            <span class="scan-line"></span>
          </div>
          <svg class="nav-icon icon-heart" viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path>
          </svg>
        </button>
      </li>

      <!-- Tab 3: Add New -->
      <li class="nav-item">
        <button class="nav-btn" data-tab="plus" aria-label="Add New">
          <div class="spotlight-lamp" aria-hidden="true">
            <span class="indicator-bar"></span>
            <span class="spotlight-beam"></span>
            <span class="scan-line"></span>
          </div>
          <svg class="nav-icon icon-plus" viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9.5"></circle>
            <line x1="12" y1="8" x2="12" y2="16"></line>
            <line x1="8" y1="12" x2="16" y2="12"></line>
          </svg>
        </button>
      </li>

      <!-- Tab 4: Profile -->
      <li class="nav-item">
        <button class="nav-btn" data-tab="profile" aria-label="Profile">
          <div class="spotlight-lamp" aria-hidden="true">
            <span class="indicator-bar"></span>
            <span class="spotlight-beam"></span>
            <span class="scan-line"></span>
          </div>
          <svg class="nav-icon icon-profile" viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </button>
      </li>

      <!-- Tab 5: Notifications -->
      <li class="nav-item">
        <button class="nav-btn" data-tab="bell" aria-label="Notifications">
          <div class="spotlight-lamp" aria-hidden="true">
            <span class="indicator-bar"></span>
            <span class="spotlight-beam"></span>
            <span class="scan-line"></span>
          </div>
          <svg class="nav-icon icon-bell" viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path>
            <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path>
          </svg>
          <span class="badge-dot" aria-hidden="true"></span>
        </button>
      </li>

    </ul>
  </nav>

  <script src="script.js"></script>
</body>
</html>
